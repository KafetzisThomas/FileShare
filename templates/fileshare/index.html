{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FileShare - A P2P file transfer tool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'main.css' %}">
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
</head>
<body>
    <main role="main" class="container">
        <div class="form-section">
            <h1 class="text-primary text-center mb-3">FileShare</h1>
            <div class="mb-3">
                <p>Your Unique ID: <span id="myUserId" class="badge bg-primary"></span></p>
            </div>

            <form id="form">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Choose a file:</label>
                    <input type="file" id="fileInput" class="form-control" name="file" required />
                </div>

                <div class="mb-3">
                    <label for="userInput" class="form-label">Recipient's unique ID:</label>
                    <input type="text" id="userInput" class="form-control" name="user" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Send File</button>
            </form>

            <div class="file-info mt-3 fs-5">
                <small class="text-muted">You can select a file and send it to any connected user.</small>
            </div>
        </div>
    </main>

    <footer class="footer text-dark py-3 fixed-bottom">
        <div class="container">
            <hr class="border-dark mb-1">
            <div class="row justify-content-between align-items-center">
                <div class="col-12 col-md-6 mt-3 text-center text-md-start">
                    <p>&copy; 2024 KafetzisThomas</p>
                </div>
                <div class="col-12 col-md-6 text-center text-md-end mt-md-0">
                    <a href="https://github.com/KafetzisThomas/FileShare" target="_blank" class="btn btn-link btn-floating btn-md text-dark m-1" role="button">
                        <i class="bi bi-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="{% static 'main.js' %}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
